; TrueHUD LE native options. Restart Skyrim after editing this file.
[General]
; 0: no TrueHUD log writes or diagnostic movie probes; 1: diagnostics plus bounded sampling/UI/advance/render timing summaries.
bEnableLogging=0

[Performance]
; Ordinary actors only: milliseconds between physical visibility probes (0-250).
; Resource values and invisibility still update every frame. Targets bypass LOS.
; 100 limits world-occlusion response latency to 100ms. 0 restores per-frame LOS.
uVisibilityUpdateIntervalMS=100
